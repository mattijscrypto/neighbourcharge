# Pluggo CSMS — nginx reverse proxy
#
# Installeren:
#   sudo cp deploy/nginx-csms.conf /etc/nginx/sites-available/csms.pluggo.app
#   sudo ln -s /etc/nginx/sites-available/csms.pluggo.app /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Certbot voor TLS:
#   sudo certbot --nginx -d csms.pluggo.app --agree-tos -m info@pluggoapp.nl --redirect
#
# Certbot past dit bestand automatisch aan (voegt ssl_certificate directives toe).
# De HTTP-blok blijft alleen voor Let's Encrypt renewals + redirect naar HTTPS.

# Nodig voor WebSocket upgrade: mapping van Upgrade header naar Connection.
# Zet in een aparte block zodat 'ie maar één keer voorkomt (idempotent bij herconfig).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit voor de HTTP-API — voorkomt dat een boze/kapotte Edge Function
# de CSMS platlegt. 30 req/sec per IP is ruim voor onze use case.
limit_req_zone $binary_remote_addr zone=csms_api:10m rate=30r/s;

# ============================================================================
# HTTP (port 80) — alleen voor Let's Encrypt validation + redirect
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name csms.pluggo.app;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Alle andere verkeer → HTTPS (certbot voegt hier ook een 301 redirect toe)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS (port 443) — productie verkeer
#
# Certbot voegt hier automatisch ssl_certificate, ssl_certificate_key,
# include /etc/letsencrypt/options-ssl-nginx.conf, en ssl_dhparam toe.
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csms.pluggo.app;

    # === SSL wordt door certbot ingevuld ===
    # ssl_certificate     /etc/letsencrypt/live/csms.pluggo.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/csms.pluggo.app/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modern security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Access + error logs — apart van default zodat je makkelijk kunt filteren
    access_log /var/log/nginx/csms.access.log;
    error_log  /var/log/nginx/csms.error.log warn;

    # Grote body's maken we niet — HTTP-API heeft 64KB limit ingebouwd
    client_max_body_size 128k;

    # ------------------------------------------------------------------------
    # /health — publieke health check (geen rate limit, geen auth)
    # ------------------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:9001/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # /api/* — HTTP-API (RemoteStart, RemoteStop, list chargers)
    # Gerouteerd naar localhost:9001. Prefix /api wordt gestripped.
    # ------------------------------------------------------------------------
    location /api/ {
        limit_req zone=csms_api burst=10 nodelay;

        # Strip /api prefix → localhost:9001/chargers/... etc.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Behoud custom auth header
        proxy_set_header X-CSMS-API-Key $http_x_csms_api_key;

        # Timeouts — RemoteStart wacht max 10s op paal (zie http-api.js)
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # ------------------------------------------------------------------------
    # / — WebSocket voor paal-verbindingen (OCPP)
    # Alles wat NIET /api of /health is → localhost:9000 met WS upgrade.
    # De identity komt uit het pad: wss://csms.pluggo.app/CP-001 → identity=CP-001
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:9000;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Origineel host + client IP doorgeven
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts voor WebSocket — palen sturen elke 5 min een heartbeat,
        # dus houd de verbinding minimaal 10 min open zonder traffic.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Buffer klein houden — WS is realtime
        proxy_buffering off;
    }
}
